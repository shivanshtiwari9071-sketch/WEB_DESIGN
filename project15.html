%%html
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Student Information Form</title></head><body><h1>Student Information</h1><form action="#" method="get"><fieldset><legend>Personal details</legend>
<p><label for="name">Full name:</label> <input id="name" name="name" type="text" required></p><p><label for="email">Email:</label> <input id="email" name="email" type="email" required></p>
<p><label for="password">Password:</label> <input id="password" name="password" type="password" required></p><p><label for="dob">Date of birth:</label> <input id="dob" name="dob" type="date"></p>
<p><label for="phone">Mobile number:</label> <input id="phone" name="phone" type="tel"></p><p>Preferred contact: <label><input type="radio" name="contact" value="email"> Email</label> <label><input type="radio" name="contact" value="phone"> Phone</label></p>
<p><label><input type="checkbox" name="updates" value="yes"> Send me school updates</label></p><p><label for="photo">Profile photo:</label> <input id="photo" name="photo" type="file" accept="image/*"></p></fieldset><p><button type="submit">Submit</button> <button type="reset">Clear</button></p></form></body></html>
